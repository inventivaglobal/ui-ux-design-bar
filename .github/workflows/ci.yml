name: B.A.R CI
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Run engine tests
        run: node --test tests/*.test.mjs
      - name: Pack, install and smoke-test CLI and exports
        run: npm run test:package
      - name: Validate JSON manifests
        run: |
          node -e "const fs=require('fs'); for (const p of ['packages/tokens/tokens.json','packages/registry/components/action-button.json','packages/registry/icons/semantic-icons.json','packages/qa/rules.json']) JSON.parse(fs.readFileSync(p,'utf8')); console.log('JSON manifests valid')"
  browser-example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-example-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  windows-desktop:
    uses: ./.github/workflows/windows-desktop.yml
  release:
    name: Publish explicit GitHub release
    needs: [engine-tests, browser-example, windows-desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: browser-example-report
          path: release-browser-evidence
      - uses: actions/download-artifact@v4
        with:
          name: BAR-windows-x64-unsigned
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: BAR-windows-desktop-test-evidence
          path: release-desktop-evidence
      - name: Verify Windows producer integrity and commit
        run: |
          (cd release-artifacts && sha256sum -c SHA256SUMS)
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("release-artifacts/provenance.json")); const v=JSON.parse(fs.readFileSync("package.json")).version; if(p.commit!==process.env.GITHUB_SHA||p.version!==v)throw Error("Windows artifact provenance mismatch");'
      - name: Pack exact tested source and checksum
        run: |
          mkdir -p release-artifacts
          npm pack --ignore-scripts --json --pack-destination release-artifacts > release-artifacts/pack.json
          (cd release-browser-evidence && zip -qr ../release-artifacts/browser-evidence.zip .)
          (cd release-desktop-evidence && zip -qr ../release-artifacts/windows-desktop-evidence.zip .)
          cd release-artifacts
          sha256sum *.tgz *.exe *.zip provenance.json pack.json > SHA256SUMS
      - name: Publish no-overwrite versioned artifact (never npm)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo 'Invalid release version'; exit 1; }
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite release assets.'
            exit 1
          fi
          # Create the lightweight tag atomically, or accept only an exact retry target.
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + ":" + .object.sha' 2>/dev/null); then
            [[ "$existing" == "commit:$GITHUB_SHA" ]] || { echo 'Tag points elsewhere; refusing release'; exit 1; }
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          fi
          actual=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.type + ":" + .object.sha')
          [[ "$actual" == "commit:$GITHUB_SHA" ]] || { echo 'Tag verification failed'; exit 1; }
          options=()
          if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$tag" release-artifacts/*.tgz release-artifacts/*.exe release-artifacts/*.zip release-artifacts/SHA256SUMS release-artifacts/pack.json release-artifacts/provenance.json \
            --verify-tag --target "$GITHUB_SHA" --title "B.A.R $version" --notes-file docs/RELEASE-NOTES.md "${options[@]}"
  verify-published-windows:
    name: Verify downloaded public Windows release
    needs: release
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - name: Download public EXE, verify checksum and PE header
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $name = "BAR-$version-windows-x64-setup.exe"
          $base = "https://github.com/${{ github.repository }}/releases/download/v$version"
          New-Item desktop-dist -ItemType Directory
          Invoke-WebRequest "$base/$name" -OutFile "desktop-dist/$name"
          Invoke-WebRequest "$base/SHA256SUMS" -OutFile desktop-dist/SHA256SUMS
          $line = @(Get-Content desktop-dist/SHA256SUMS | Where-Object { $_.EndsWith("  $name") })
          if ($line.Count -ne 1) { throw 'Missing or ambiguous EXE checksum' }
          if ((Get-FileHash "desktop-dist/$name" -Algorithm SHA256).Hash.ToLower() -ne $line[0].Split(' ')[0]) { throw 'Published EXE checksum mismatch' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path "desktop-dist/$name"))
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Not a Windows executable' }
          $pe = [BitConverter]::ToInt32($bytes, 60)
          if ($bytes[$pe] -ne 80 -or $bytes[$pe+1] -ne 69 -or $bytes[$pe+2] -ne 0 -or $bytes[$pe+3] -ne 0) { throw 'Invalid PE signature' }
      - name: Install downloaded release, exercise GUI, uninstall
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-windows-download-verification
          path: desktop-test-results/
          if-no-files-found: warn
          retention-days: 30
