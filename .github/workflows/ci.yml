name: B.A.R CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Run engine tests
        run: node --test tests/*.test.mjs
      - name: Pack, install and smoke-test CLI and exports
        run: npm run test:package
      - name: Validate JSON manifests
        run: |
          node -e "const fs=require('fs'); for (const p of ['packages/tokens/tokens.json','packages/registry/components/action-button.json','packages/registry/icons/semantic-icons.json','packages/qa/rules.json']) JSON.parse(fs.readFileSync(p,'utf8')); console.log('JSON manifests valid')"
  browser-example:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-example-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
